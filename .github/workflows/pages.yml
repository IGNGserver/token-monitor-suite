name: Pages

on:
  push:
    branches: ['main']
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build static site
        run: node site/build.mjs
      - name: Add the latest formal-release APT repository
        env:
          GH_TOKEN: ${{ github.token }}
          APT_REPOSITORY_GPG_PRIVATE_KEY: ${{ secrets.TOKEN_MONITOR_APT_GPG_PRIVATE_KEY }}
          APT_REPOSITORY_GPG_KEY_ID: ${{ secrets.TOKEN_MONITOR_APT_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -z "$latest_tag" ]; then
            echo "No formal GitHub Release exists yet; deploying the static site without an APT repository."
            exit 0
          fi
          if [ -z "$APT_REPOSITORY_GPG_PRIVATE_KEY" ] || [ -z "$APT_REPOSITORY_GPG_KEY_ID" ]; then
            echo "A formal Release exists but APT repository signing is not configured; refusing to deploy a Pages site that would erase the APT repository." >&2
            exit 1
          fi
          mkdir -p apt-input
          gh release download "$latest_tag" --pattern '*.deb' --dir apt-input --clobber
          printf '%s' "$APT_REPOSITORY_GPG_PRIVATE_KEY" | gpg --batch --import
          node scripts/build-apt-repository.js \
            --input-dir apt-input \
            --output-dir _site/apt \
            --suite stable \
            --signing-key "$APT_REPOSITORY_GPG_KEY_ID" \
            --require-signature
          cp packaging/linux/token-monitor.sources _site/apt/token-monitor.sources
          gpg --armor --export "$APT_REPOSITORY_GPG_KEY_ID" > _site/apt/token-monitor-archive-keyring.asc
          fingerprint="$(gpg --with-colons --fingerprint "$APT_REPOSITORY_GPG_KEY_ID" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$fingerprint"
          printf '%s\n' "$fingerprint" > _site/apt/token-monitor-archive-keyring-fingerprint.txt
          echo "Published APT archive key fingerprint: $fingerprint"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
