services:
  mysql:
    image: mysql:8.4.8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-token_monitor}
      MYSQL_USER: ${MYSQL_USER:-token_monitor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - token-monitor-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  hub:
    # Published with Windows/Android on each GitHub Release (GHCR).
    # Pin a version with TOKEN_MONITOR_VERSION=0.34.2 (or v0.34.2); default is latest.
    image: ghcr.io/igngserver/token-monitor-hub:${TOKEN_MONITOR_VERSION:-latest}
    # Optional local build for contributors (git clone + Dockerfile present):
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TOKEN_MONITOR_PORT: 17321
      TOKEN_MONITOR_HOST: 0.0.0.0
      TOKEN_MONITOR_SECRET: ${TOKEN_MONITOR_SECRET}
      TOKEN_MONITOR_ADMIN_SECRET: ${TOKEN_MONITOR_ADMIN_SECRET}
      TOKEN_MONITOR_VIEWER_SECRET: ${TOKEN_MONITOR_VIEWER_SECRET}
      TOKEN_MONITOR_INGEST_CREDENTIALS: '${TOKEN_MONITOR_INGEST_CREDENTIALS:-{}}'
      TOKEN_MONITOR_ALLOW_LEGACY_INGEST: ${TOKEN_MONITOR_ALLOW_LEGACY_INGEST:-0}
      TOKEN_MONITOR_ALLOW_LEGACY_ADMIN: ${TOKEN_MONITOR_ALLOW_LEGACY_ADMIN:-0}
      TOKEN_MONITOR_ALLOW_INSECURE_HTTP: ${TOKEN_MONITOR_ALLOW_INSECURE_HTTP:-0}
      TOKEN_MONITOR_STALE_AFTER_MS: ${TOKEN_MONITOR_STALE_AFTER_MS:-600000}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-token_monitor}
      MYSQL_USER: ${MYSQL_USER:-token_monitor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TOKSCALE_PRICING_CATALOG_URL: ${TOKSCALE_PRICING_CATALOG_URL:-https://models.dev/api.json}
      # Optional HTTPS (enable true PWA install on mobile LAN clients):
      TOKEN_MONITOR_TLS_CERT: ${TOKEN_MONITOR_TLS_CERT:-}
      TOKEN_MONITOR_TLS_KEY: ${TOKEN_MONITOR_TLS_KEY:-}
      TOKEN_MONITOR_TLS_CA: ${TOKEN_MONITOR_TLS_CA:-}
    # Mount certs when TLS env paths are set, e.g.:
    # volumes:
    #   - ./certs:/certs:ro
    ports:
      - "${TOKEN_MONITOR_PORT:-17321}:17321"

volumes:
  token-monitor-mysql:
