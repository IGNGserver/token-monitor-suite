<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
    <title>Token Monitor</title>
    <link rel="stylesheet" href="../shared-ui/styles/app.css" />
    <link rel="stylesheet" href="desktop.css" />
  </head>
  <body>
    <!--
      Same shell structure the Hub dashboard serves, so the shared UI finds the
      same element ids. The desktop differences are deliberate: the native app
      menu replaces the PWA install banner, and the auth gate is inert because
      the credential store supplies the Hub secret.
    -->
    <a class="skip-link" href="#content" data-i18n="nav.skip">Skip to content</a>
    <div id="app" class="app">
      <aside class="sidebar" aria-label="Primary">
        <div class="brand">
          <img class="brand-mark" src="../../assets/icon.png" width="28" height="28" alt="" />
          <div class="brand-copy">
            <strong>Token Monitor</strong>
            <span data-i18n="brand.subtitle">Hub dashboard</span>
          </div>
        </div>
        <nav class="nav" id="primaryNav"></nav>
        <div class="sidebar-foot">
          <div id="streamStatus" class="stream-status" data-state="offline">
            <span class="stream-dot" aria-hidden="true"></span>
            <span id="streamStatusText">Offline</span>
          </div>
          <button type="button" id="settingsOpen" class="ghost-btn sidebar-settings" data-i18n="nav.settings">Settings</button>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" id="menuToggle" class="icon-btn mobile-only" aria-label="Menu" aria-controls="primaryNav" aria-expanded="false" data-i18n-aria="nav.menu"><span class="ui-icon-slot" data-ui-icon="menu"></span></button>
            <div>
              <h1 id="pageTitle" class="page-title">Home</h1>
              <p id="pageMeta" class="page-meta">—</p>
            </div>
          </div>
          <div class="topbar-actions">
            <label class="device-filter">
              <span data-i18n="filters.device">Device</span>
              <select id="deviceFilter" aria-label="Device filter"><option value="" data-i18n="filters.allDevices">All devices</option></select>
            </label>
            <div class="period-tabs" id="periodTabs" role="tablist" aria-label="Period"></div>
            <button type="button" id="customRangeBtn" class="icon-btn" title="Custom range" aria-label="Custom range" aria-controls="rangePopover" aria-expanded="false"><span class="ui-icon-slot" data-ui-icon="range"></span></button>
            <button type="button" id="refreshBtn" class="icon-btn" title="Refresh" aria-label="Refresh"><span class="ui-icon-slot" data-ui-icon="refresh"></span></button>
            <button type="button" id="settingsOpenTop" class="icon-btn mobile-only" title="Settings" aria-label="Settings" data-i18n-aria="nav.settings"><span class="ui-icon-slot" data-ui-icon="settings"></span></button>
          </div>
        </header>

        <section class="hero" id="heroStrip">
          <div class="hero-card">
            <span class="hero-label" data-i18n="stats.tokens">Tokens</span>
            <strong id="totalTokens" class="hero-value">0</strong>
          </div>
          <div class="hero-card">
            <span class="hero-label" data-i18n="stats.cost">Cost</span>
            <strong id="totalCost" class="hero-value">$0</strong>
          </div>
          <div class="hero-card">
            <span class="hero-label" data-i18n="stats.devices">Devices</span>
            <strong id="deviceCount" class="hero-value">0</strong>
          </div>
          <div class="hero-card">
            <span class="hero-label" data-i18n="stats.live">Live</span>
            <strong id="liveLabel" class="hero-value hero-live">—</strong>
          </div>
        </section>

        <main id="content" class="content" tabindex="-1"></main>
      </div>
    </div>

    <!--
      Element parity with the Hub shell. The desktop client always has a
      credentialed connection, so this stays hidden; the markup exists so the
      shared boot code does not fail on a missing node.
    -->
    <div id="authGate" class="auth-gate hidden" role="dialog" aria-modal="true" aria-labelledby="authTitle" hidden>
      <form id="authForm" class="auth-card">
        <h2 id="authTitle" data-i18n="auth.title">Connect to hub</h2>
        <p class="muted" data-i18n="auth.desc">Enter the shared secret configured on this hub.</p>
        <label class="field">
          <span data-i18n="auth.secret">Shared secret</span>
          <input id="secretInput" type="password" autocomplete="current-password" spellcheck="false" />
        </label>
        <label class="check-row">
          <input id="rememberSecret" type="checkbox" checked />
          <span data-i18n="auth.remember">Remember on this device</span>
        </label>
        <p id="authError" class="form-error hidden"></p>
        <button type="submit" class="primary-btn" data-i18n="auth.connect">Open dashboard</button>
      </form>
    </div>

    <div id="settingsDrawer" class="drawer hidden" aria-hidden="true">
      <div class="drawer-backdrop" data-close-settings></div>
      <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" tabindex="-1">
        <header class="drawer-head">
          <h2 id="settingsTitle" data-i18n="settings.quick">Quick settings</h2>
          <button type="button" class="icon-btn" data-close-settings aria-label="Close"><span class="ui-icon-slot" data-ui-icon="close"></span></button>
        </header>
        <div class="drawer-body">
          <label class="field">
            <span data-i18n="settings.language">Language</span>
            <select id="languageSelect">
              <option value="auto">Auto</option>
              <option value="en">English</option>
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁體中文</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="settings.theme">Theme</span>
            <select id="themeSelect">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="settings.currency">Currency</span>
            <select id="currencySelect">
              <option value="USD">USD</option>
              <option value="CNY">CNY</option>
              <option value="TWD">TWD</option>
              <option value="HKD">HKD</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="settings.homeLimitAccountCount">Home limit accounts</span>
            <input id="homeLimitAccountCount" type="number" min="1" max="12" step="1" value="3" />
          </label>
          <p class="muted tiny" id="aboutLine">Token Monitor</p>
        </div>
      </aside>
    </div>

    <div id="rangePopover" class="popover hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="rangeTitle">
      <div class="popover-card" tabindex="-1">
        <header class="popover-head">
          <h3 id="rangeTitle" data-i18n="range.title">Custom range</h3>
          <button type="button" class="icon-btn" id="rangeClose" aria-label="Close"><span class="ui-icon-slot" data-ui-icon="close"></span></button>
        </header>
        <div class="popover-body">
          <label class="field">
            <span data-i18n="range.from">From</span>
            <input id="rangeFrom" type="datetime-local" />
          </label>
          <label class="field">
            <span data-i18n="range.to">To</span>
            <input id="rangeTo" type="datetime-local" />
          </label>
          <p id="rangeError" class="form-error hidden"></p>
          <div class="drawer-actions">
            <button type="button" id="rangeApply" class="primary-btn" data-i18n="range.apply">Apply</button>
            <button type="button" id="rangeClear" class="ghost-btn" data-i18n="range.clear">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
    <div id="navScrim" class="nav-scrim hidden"></div>
    <!-- Desktop-only settings groups are mounted here by the settings view. -->
    <div id="desktopSettingsRoot" hidden></div>

    <script type="module" src="boot.js"></script>
  </body>
</html>
