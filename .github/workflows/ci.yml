name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Node coverage on Linux; latest-Node smoke on macOS/Windows to
        # catch platform-specific bugs (macOS window/vibrancy, WSL/paths on Windows).
        os: [ubuntu-latest]
        node-version: ['22', '24']
        include:
          - os: macos-latest
            node-version: '24'
          - os: windows-latest
            node-version: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Keep CI on the same gate developers use locally: this includes the
      # product-scope, shared-UI boundary and renderer CSS guards in addition
      # to lint and the Node test suite.
      - run: npm run verify
